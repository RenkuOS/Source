name: publish pcloudfs test image

# Publishes the .img of an existing x270-build run as a public release zip.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id of the x270-build run to publish'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          RUN_NUMBER=$(gh run view "$RUN_ID" --repo 12akakor/Source \
            --json number --jq .number)
          echo "Publishing x270-build #$RUN_NUMBER ($RUN_ID)"
          gh run download "$RUN_ID" --repo 12akakor/Source \
            --name "renku-x86_64-x270-build${RUN_NUMBER}" --dir image
          ls -la image

      - name: Zip and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          IMG=$(find image -name '*.img' | head -1)
          if [ -z "$IMG" ]; then echo "::error::no .img found"; exit 1; fi
          cp "$IMG" pcloudfs-test.img
          zip -9 pcloudfs-test.zip pcloudfs-test.img
          sha256sum pcloudfs-test.zip > pcloudfs-test.zip.sha256
          if gh release view pcloudfs-test --repo 12akakor/Source >/dev/null 2>&1; then
            gh release delete pcloudfs-test --repo 12akakor/Source --cleanup-tag --yes
          fi
          gh release create pcloudfs-test pcloudfs-test.zip pcloudfs-test.zip.sha256 \
            --repo 12akakor/Source --target ${{ github.sha }} \
            --title "pcloudfs test image" --prerelease --latest=false \
            --notes 'Test image for pcloudfs phase 1 (read-only). Write the .img to a USB stick in DD mode. Read SYSLOG.TXT from the FAT partition after testing and send it back together with /boot/home/tests/pcloudfs-test-results.txt.'
