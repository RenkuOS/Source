# Test builds: images from any branch, published where a bug reporter can
# download them without a GitHub account.
#
# Run it by hand from the Actions tab ("test build" -> "Run workflow"), pick
# the branch, and give the build a short name. The images are built and
# boot-checked exactly like the nightly (image.yml), then published as the
# prerelease `test-<name>`. The nightly release is never touched.
#
#   - A branch must be in RenkuOS/Source to be picked. For a contributor's
#     pull request, push its head to a branch here first, for example
#     `git fetch origin pull/343/head && git push origin FETCH_HEAD:refs/heads/test/343`.
#   - Running again with the same name replaces that release, so the link you
#     gave the reporter keeps working and always points at the newest images.
#   - Images are labelled test<run number> (in the About window and the file
#     name), so they cannot be mistaken for a nightly build<run number>.
#   - Delete the release when the bug is closed:
#     gh release delete test-<name> --cleanup-tag --yes
#
# A TRUSTED workflow like nightly.yml: manual dispatch only, never a
# pull_request trigger. Only the publish job can write, and it runs no code
# from the branch.
name: test build

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Short name, published as the release test-<name> (e.g. 371-no-hpet)'
        type: string
        required: true
      notes:
        description: 'For the reporter: what is different from main and what to try'
        type: string
        required: true
      arches:
        description: 'Which images to build'
        type: choice
        options:
          - both
          - x86_64
          - x86_gcc2h
        default: both
      publish_unbooted:
        description: 'Also publish images that failed the QEMU boot check'
        type: boolean
        default: false

permissions:
  # Same as nightly.yml: write to create the release, and read to download
  # this run's artifacts in the publish job. image.yml lowers its own jobs to
  # contents: read.
  contents: write
  actions: read

concurrency:
  group: test-build-${{ inputs.name }}
  cancel-in-progress: true

jobs:
  check:
    name: check inputs
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      arches: ${{ steps.v.outputs.arches }}
    steps:
      - id: v
        env:
          NAME: ${{ inputs.name }}
          ARCHES: ${{ inputs.arches }}
        run: |
          set -euo pipefail
          # The name becomes a git tag and part of a URL. Keep it boring.
          if ! [[ "${NAME}" =~ ^[a-z0-9][a-z0-9.-]{0,39}$ ]]; then
            echo "::error::name must be 1-40 characters of a-z, 0-9, '.' and '-', starting with a letter or digit (got '${NAME}')"
            exit 1
          fi
          case "${ARCHES}" in
            both) arches='x86_64 x86_gcc2h' ;;
            x86_64|x86_gcc2h) arches="${ARCHES}" ;;
            *) echo "::error::unknown arches '${ARCHES}'"; exit 1 ;;
          esac
          echo "tag=test-${NAME}" >> "$GITHUB_OUTPUT"
          echo "arches=${arches}" >> "$GITHUB_OUTPUT"

  image:
    needs: check
    uses: ./.github/workflows/image.yml
    with:
      arches: ${{ needs.check.outputs.arches }}
      build_prefix: test

  publish:
    name: publish
    needs: [check, image]
    # Runs even if one arch failed, so a good arch still ships.
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Collect images
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHES: ${{ needs.check.outputs.arches }}
          PUBLISH_UNBOOTED: ${{ inputs.publish_unbooted }}
        run: |
          set -uo pipefail
          mkdir -p staging
          published=""; rows=""
          for arch in ${ARCHES}; do
            if gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
                 --name "boot-pass-${arch}" --dir "/tmp/pass-${arch}" 2>/dev/null; then
              boot="passed"
            elif [ "${PUBLISH_UNBOOTED}" = "true" ]; then
              boot="**failed** (published anyway)"
              echo "::warning::${arch} did not pass the boot check; publishing it anyway."
            else
              echo "::warning::${arch} did not pass the boot check; not publishing it."
              rows="${rows}| ${arch} | failed, not published |"$'\n'
              continue
            fi
            if gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" \
                 --name "image-${arch}" --dir "staging" 2>/dev/null; then
              published="${published} ${arch}"
              rows="${rows}| ${arch} | ${boot} |"$'\n'
            else
              echo "::warning::no image artifact for ${arch}"
              rows="${rows}| ${arch} | not built |"$'\n'
            fi
          done
          echo "arches=${published# }" >> "$GITHUB_OUTPUT"
          { echo "rows<<ROWS_EOF"; printf '%s' "${rows}"; echo "ROWS_EOF"; } >> "$GITHUB_OUTPUT"
          ls -la staging || true
          [ -n "$(ls -A staging 2>/dev/null)" ] || { echo "::error::Nothing to publish."; exit 1; }

      # One release per name. It is deleted and created again, rather than
      # edited, so its tag always points at the commit that was built.
      - name: Publish the test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          NOTES: ${{ inputs.notes }}
          BRANCH: ${{ github.ref_name }}
          ROWS: ${{ steps.collect.outputs.rows }}
        run: |
          set -euo pipefail
          BUILD="test$(printf '%05d' "${{ github.run_number }}")"
          REPO="${{ github.repository }}"

          {
            echo "**Test build for one bug, not a release.** It may not boot, and it"
            echo "may be deleted once the bug is fixed."
            echo ""
            printf '%s\n' "${NOTES}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Build | \`${BUILD}\` |"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| Commit | ${GITHUB_SHA} |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo ""
            echo "| Image | QEMU boot check |"
            echo "|---|---|"
            printf '%s\n' "${ROWS}"
            echo ""
            echo "\`x86_gcc2h\` is the 32-bit image. Verify a download with the"
            echo "matching \`.sha256\` file."
          } > notes.md

          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --repo "${REPO}" --cleanup-tag --yes
          fi
          gh release create "${TAG}" staging/* --repo "${REPO}" \
            --target "${GITHUB_SHA}" --title "Test build ${TAG#test-} (${BUILD})" \
            --notes-file notes.md --prerelease --latest=false

          {
            echo "### Published"
            echo ""
            echo "https://github.com/${REPO}/releases/tag/${TAG}"
            echo ""
            for f in staging/*.iso; do echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"; done
          } >> "$GITHUB_STEP_SUMMARY"
